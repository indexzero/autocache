name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --if-present build

      - name: Test
        run: pnpm -r test

      - name: Typecheck
        run: pnpm -r typecheck

      # The two smokes cover the layer tsc and the tests cannot: what actually
      # ships. Pack proves every manifest entry-point claim (exports/main/bin)
      # names a file inside the tarball npm would publish; edge proves the
      # ./fastly and ./cloudflare graphs bundle from the built dist under the
      # real deploy bundlers (js-compute-runtime, esbuild-with-worker-conditions).
      - name: Pack smoke
        run: pnpm run smoke:pack

      - name: Edge bundle smoke
        run: pnpm --filter @autocache/waybackify-serve run smoke:edge
