name: Publish

on:
  release:
    types: [published]

# Trusted publishing: the job authenticates to npm with a short-lived OIDC
# token (id-token: write), matched against each package's Trusted Publisher
# binding (this repo + this workflow file) on npmjs.com. No NPM_TOKEN secret
# is needed, and provenance attestations come with it for free. pnpm 12
# (the packageManager pin) speaks the OIDC exchange natively. On the pnpm 11
# line, OIDC needs >= 11.1.3.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --if-present build

      - name: Publish to npm
        run: pnpm -r publish --access public --no-git-checks
