<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wayback Machine</title>
  <script type="text/javascript" src="//archive.org/includes/analytics.js?v=cf34f82"></script>
  <link rel="stylesheet" type="text/css" href="/_static/css/banner-styles.css"/>
</head>
<body>
  <!-- Synthetic (#363): a faithful minimal reconstruction of archive.org's
       raw-asset VIEWER shell — the page stored where a PDF's bytes should be,
       served as text/html. NOT copied from any operator sweep artifact; hand
       built from the two signature markers (the Wayback Machine title + the
       id="playback" viewer iframe). The real bytes are one id_ refetch away. -->
  <div id="wm-ipp-base"></div>
  <div id="wm-ipp-print"></div>
  <iframe id="playback" title="Wayback Machine viewer"
          src="/web/20140403040000id_/http://example.com/report.pdf"
          scrolling="yes" frameborder="0"
          style="position:absolute;top:0;left:0;width:100%;height:100%;border:0"></iframe>
</body>
</html>
